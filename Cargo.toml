[package]
name = "auditmcp"
version = "0.1.0"
edition = "2021"
description = "Local-first audit logging proxy for MCP tool calls"
license = "MIT"

[[bin]]
name = "auditmcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
# HTTP transport. hyper directly rather than a framework: this proxy's value
# is that it does not alter traffic, and higher-level clients default to
# following redirects, decompressing bodies and normalizing headers -- all
# wrong here, and doubly so since MCP 2026-07-28 has servers reject requests
# whose headers disagree with their body. Pure Rust, no C dependency, so
# cross-compiled release binaries stay simple.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
# TLS for outbound upstream connections only; auditmcp itself listens on
# loopback in cleartext. rustls with compiled-in Mozilla roots rather than
# native-tls: no OpenSSL, no C toolchain, and no dependency on a system
# certificate store, which is what keeps cross-compiled release binaries
# simple. The trade is that a corporate TLS-inspecting proxy's private CA is
# not trusted -- see the README.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-tokio", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[target."cfg(windows)".dependencies]
winapi = { version = "0.3.9", features = ["winnt"] }
windows-acl = "0.3.0"
